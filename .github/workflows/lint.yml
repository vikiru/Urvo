name: Lint Files
run-name: Lint files using Biome
on:
    pull_request:
        branches:
            - main
permissions:
    contents: read
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "lts/*"
            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.0.0
              with:
                  version: 11.20.0
            - name: Install dependencies
              run: pnpm install --frozen-lockfile # Install from frozen lockfile
            - name: Lint files
              run: pnpm lint
