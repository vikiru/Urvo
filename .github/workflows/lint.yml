name: Lint Files
run-name: Lint files using Biome
on:
    pull_request:
        branches:
            - main
permissions:
    contents: read
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "lts/*"
            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.0.0
              with:
                  version: 11.20.0
            - name: Install dependencies
              run: pnpm install --frozen-lockfile # Install from frozen lockfile
            - name: Lint files
              run: pnpm lint
