name: Format Files
run-name: Format files using Biome
on:
    push:
        branches:
            - main
permissions:
    contents: write
jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false
            - name: Setup github-actions[bot] git config
              run: |
                  git config --local user.name "github-actions[bot]"
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "lts/*"
            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.0.0
              with:
                  version: 11.20.0
            - name: Install dependencies
              run: pnpm install --frozen-lockfile # Install from frozen lockfile
            - name: Format files
              run: pnpm run format
            - name: Check for changes
              id: changes
              run: |
                  git add -A
                  if git diff --staged --quiet; then
                    echo "changes_exist=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  else
                    echo "changes_exist=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Output if changes exist
              env:
                  CHANGES_EXIST: ${{ steps.changes.outputs.changes_exist }}
              run: echo "$CHANGES_EXIST"
            - name: Commit formatting changes via GitHub Actions, if changes exist
              if: steps.changes.outputs.changes_exist == 'true'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |-
                  git commit -m "chore: format files via github actions"
                  git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
